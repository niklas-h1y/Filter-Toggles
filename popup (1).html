<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 15px;
    }
    h3 {
      margin: 0 0 15px 0;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: #fff;
      border-bottom: 1px solid #2d2d2d;
      padding-bottom: 8px;
    }
    .filter-group {
      margin-bottom: 12px;
    }
    .filter-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #aaa;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #0076ff;
      background: #2d2d2d;
      height: 4px;
      border-radius: 2px;
      outline: none;
    }
    .btn-container {
      margin-top: 15px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: #2d2d2d;
      border: none;
      color: #fff;
      padding: 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #3d3d3d;
    }
    #reset-btn {
      background: #ff3b30;
    }
    #reset-btn:hover {
      background: #e0352b;
    }
  </style>
</head>
<body>
  <h3>Filter Matrix</h3>
  
  <div class="filter-group">
    <div class="filter-label"><span>Grayscale</span><span id="val-grayscale">0%</span></div>
    <input type="range" id="grayscale" min="0" max="100" value="0">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Contrast</span><span id="val-contrast">100%</span></div>
    <input type="range" id="contrast" min="0" max="1000" value="100">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Invert</span><span id="val-invert">0%</span></div>
    <input type="range" id="invert" min="0" max="100" value="0">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Hue Rotate</span><span id="val-hue">0°</span></div>
    <input type="range" id="hue" min="0" max="360" value="0">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Sepia</span><span id="val-sepia">0%</span></div>
    <input type="range" id="sepia" min="0" max="100" value="0">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Saturate</span><span id="val-saturate">100%</span></div>
    <input type="range" id="saturate" min="0" max="500" value="100">
  </div>

  <div class="filter-group">
    <div class="filter-label"><span>Brightness</span><span id="val-brightness">100%</span></div>
    <input type="range" id="brightness" min="0" max="200" value="100">
  </div>

  <div class="btn-container">
    <button id="preset-warm">Warm Dark</button>
    <button id="reset-btn">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
